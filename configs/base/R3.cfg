enable
configure terminal
hostname R3
no ip domain-lookup
ipv6 unicast-routing
ipv6 router ospf 1
 router-id 3.3.3.3
 exit
interface Loopback0
 ip address 10.255.0.3 255.255.255.255
 ipv6 address 2001:db8:ffff::3/128
 ipv6 ospf 1 area 0
 exit
interface GigabitEthernet0/0
 description BACKBONE-LAN
 ip address 10.0.0.3 255.255.255.0
 ipv6 address 2001:db8::3/64
 ipv6 ospf 1 area 0
 no shutdown
 exit
interface GigabitEthernet0/1
 description TO-R6-AREA2
 ip address 10.2.36.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
router ospf 1
 router-id 3.3.3.3
 log-adjacency-changes detail
 network 10.0.0.0 0.0.0.255 area 0
 network 10.255.0.3 0.0.0.0 area 0
 network 10.2.36.0 0.0.0.3 area 2
 exit
end
write memory
