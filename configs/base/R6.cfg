enable
configure terminal
hostname R6
no ip domain-lookup
interface Loopback0
 ip address 10.255.0.6 255.255.255.255
 exit
interface GigabitEthernet0/0
 description TO-R3-AREA2
 ip address 10.2.36.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
interface GigabitEthernet0/1
 description PC-B-LAN
 ip address 10.2.10.1 255.255.255.0
 no shutdown
 exit
router ospf 1
 router-id 6.6.6.6
 log-adjacency-changes detail
 passive-interface GigabitEthernet0/1
 network 10.2.0.0 0.0.255.255 area 2
 network 10.255.0.6 0.0.0.0 area 2
 exit
end
write memory
