enable
configure terminal
hostname R5
no ip domain-lookup
ipv6 unicast-routing
ipv6 router ospf 1
 router-id 5.5.5.5
 passive-interface GigabitEthernet0/2
 exit
interface Loopback0
 ip address 10.255.0.5 255.255.255.255
 exit
interface Loopback1
 description BRANCH-NET-1
 ip address 10.1.1.1 255.255.255.0
 ip ospf network point-to-point
 exit
interface Loopback2
 description BRANCH-NET-2
 ip address 10.1.2.1 255.255.255.0
 ip ospf network point-to-point
 exit
interface Loopback3
 description BRANCH-NET-3 (left as default loopback type on purpose)
 ip address 10.1.3.1 255.255.255.0
 exit
interface GigabitEthernet0/0
 description TO-R2-AREA1
 ip address 10.1.25.2 255.255.255.252
 ip ospf network point-to-point
 ipv6 address 2001:db8:1:25::2/64
 ipv6 ospf 1 area 1
 no shutdown
 exit
interface GigabitEthernet0/1
 description TO-R8-AREA4
 ip address 10.4.58.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
interface GigabitEthernet0/2
 description PC-A-LAN
 ip address 10.1.10.1 255.255.255.0
 ipv6 address 2001:db8:1:10::1/64
 ipv6 ospf 1 area 1
 no shutdown
 exit
router ospf 1
 router-id 5.5.5.5
 log-adjacency-changes detail
 passive-interface GigabitEthernet0/2
 network 10.1.0.0 0.0.255.255 area 1
 network 10.255.0.5 0.0.0.0 area 1
 network 10.4.58.0 0.0.0.3 area 4
 exit
end
write memory
