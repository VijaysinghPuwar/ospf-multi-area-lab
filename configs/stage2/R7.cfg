enable
configure terminal
hostname R7
no ip domain-lookup
interface Loopback0
 ip address 10.255.0.7 255.255.255.255
 exit
interface Loopback1
 description BRANCH-NET
 ip address 10.3.1.1 255.255.255.0
 ip ospf network point-to-point
 exit
interface GigabitEthernet0/0
 description TO-R4-AREA3
 ip address 10.3.47.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
interface GigabitEthernet0/1
 description TO-PARTNER (not OSPF)
 ip address 192.168.100.1 255.255.255.252
 no shutdown
 exit
ip route 172.16.0.0 255.255.255.0 192.168.100.2
ip route 172.16.1.0 255.255.255.0 192.168.100.2
router ospf 1
 router-id 7.7.7.7
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 network 10.3.0.0 0.0.255.255 area 3
 network 10.255.0.7 0.0.0.0 area 3
 redistribute static subnets
 exit
end
write memory
