enable
configure terminal
hostname R4
no ip domain-lookup
ipv6 unicast-routing
ipv6 router ospf 1
 router-id 4.4.4.4
 exit
interface Loopback0
 ip address 10.255.0.4 255.255.255.255
 ipv6 address 2001:db8:ffff::4/128
 ipv6 ospf 1 area 0
 exit
interface GigabitEthernet0/0
 description BACKBONE-LAN
 ip ospf priority 0
 ip address 10.0.0.4 255.255.255.0
 ipv6 address 2001:db8::4/64
 ipv6 ospf 1 area 0
 no shutdown
 exit
interface GigabitEthernet0/1
 description TO-R7-AREA3
 ip address 10.3.47.1 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
router ospf 1
 router-id 4.4.4.4
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 network 10.0.0.0 0.0.0.255 area 0
 network 10.255.0.4 0.0.0.0 area 0
 network 10.3.47.0 0.0.0.3 area 3
 exit
end
write memory
