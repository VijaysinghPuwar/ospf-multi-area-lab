enable
configure terminal
hostname R2
no ip domain-lookup
ipv6 unicast-routing
ipv6 router ospf 1
 router-id 2.2.2.2
 exit
interface Loopback0
 ip address 10.255.0.2 255.255.255.255
 ipv6 address 2001:db8:ffff::2/128
 ipv6 ospf 1 area 0
 exit
interface GigabitEthernet0/0
 description BACKBONE-LAN
 ip ospf priority 50
 ip address 10.0.0.2 255.255.255.0
 ipv6 address 2001:db8::2/64
 ipv6 ospf 1 area 0
 no shutdown
 exit
interface GigabitEthernet0/1
 description TO-R5-AREA1
 ip address 10.1.25.1 255.255.255.252
 ip ospf network point-to-point
 ipv6 address 2001:db8:1:25::1/64
 ipv6 ospf 1 area 1
 no shutdown
 exit
interface GigabitEthernet0/2
 description TO-R1-DIRECT
 ip address 10.0.12.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
router ospf 1
 router-id 2.2.2.2
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 area 1 range 10.1.0.0 255.255.0.0
 network 10.0.0.0 0.0.0.255 area 0
 network 10.0.12.0 0.0.0.3 area 0
 network 10.255.0.2 0.0.0.0 area 0
 network 10.1.25.0 0.0.0.3 area 1
 exit
end
write memory
