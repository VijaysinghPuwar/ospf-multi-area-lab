enable
configure terminal
hostname R8
no ip domain-lookup
interface Loopback0
 ip address 10.255.0.8 255.255.255.255
 exit
interface Loopback1
 description REMOTE-NET
 ip address 10.4.1.1 255.255.255.0
 ip ospf network point-to-point
 exit
interface GigabitEthernet0/0
 description TO-R5
 ip address 10.4.58.2 255.255.255.252
 ip ospf network point-to-point
 no shutdown
 exit
router ospf 1
 router-id 8.8.8.8
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 network 10.4.0.0 0.0.255.255 area 1
 network 10.255.0.8 0.0.0.0 area 1
 exit
end
write memory
